<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Accretion</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#cfe;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 18% 28%,rgba(92,66,112,.36) 0,transparent 55%),radial-gradient(ellipse at 82% 72%,rgba(40,72,112,.34) 0,transparent 58%),radial-gradient(ellipse at 62% 18%,rgba(112,82,62,.18) 0,transparent 50%),linear-gradient(115deg,transparent 35%,rgba(150,140,175,.08) 50%,transparent 65%),#0a0b14}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px;font-size:12px;line-height:1.55;pointer-events:none;text-shadow:0 0 8px #08f;letter-spacing:1px}

#msg{position:fixed;top:20%;width:100%;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}

#scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,3,10,.88);text-align:center;cursor:pointer;padding:16px;box-sizing:border-box;transition:opacity .8s}
#scr h1{font-size:clamp(30px,8vw,64px);letter-spacing:12px;margin:0;color:#fff;text-shadow:0 0 30px #6cf}

#gear{margin-left:-24px}#fs{margin-left:24px}

</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="msg"><h1></h1><p></p></div>
<div id="btns"><button class="b" data-a="dash">DASH</button><button class="b" data-a="pull">PULL</button><button class="b" data-a="wave">WAVE</button><button class="b" data-a="jet">JET</button></div>
<button id="gear" aria-label="Settings">⚙</button><button id="fs" aria-label="Fullscreen">⛶</button><div id="joy"><i></i></div><div id="set"><div class="card"><h2>SETTINGS</h2><label>Sensitivity <b id="o1"></b><input id="s1" type="range" min=".5" max="2.5" step=".1"></label><label>Sound <b id="o2"></b><input id="s2" type="range" min="0" max="1" step=".05"></label><label>Screen shake <b id="o3"></b><input id="s3" type="range" min="0" max="2" step=".1"></label><label>Zoom <b id="o4"></b><input id="s4" type="range" min=".6" max="1.6" step=".1"></label><label><input id="s5" type="checkbox"> Visual effects (particles, flashes, glow overlay)</label><button class="go" id="rsm">RESUME</button></div></div><div id="scr"></div><div id="rot">ROTATE YOUR DEVICE</div>
<script>
/* ACCRETION — simplified astrophysics, gameplay-first.
   Approximations: gravity strength ~ radius^3 (stands in for G*M), softened to avoid singularities;
   heavier bodies accelerate less toward the player (inertia); the Eddington limit is a cap on how fast
   swallowed matter can leave the disk and join the black hole; mass/stage thresholds are game values. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),scr=document.getElementById('scr'),msgEl=document.getElementById('msg');
let W,H,D;const R=Math.random,TAU=Math.PI*2,rr=(a,b)=>a+(b-a)*R();
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}addEventListener('resize',rs);rs();
const ST=['PROTOSTAR','YOUNG STAR','MAIN-SEQUENCE STAR','MASSIVE STAR','BLACK HOLE','QUASAR','SUPERMASSIVE QUASAR'];
const rad=m=>6*Math.pow(m,.4),fmt=x=>x>=1e4||x<.01?x.toExponential(1).replace('e+','e'):x.toPrecision(3);
const mm=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const SF=[];for(let i=0;i<130;i++)SF.push({x:R(),y:R(),s:rr(.4,1.6),z:rr(.1,1)});
let cfg={sens:1,vol:.6,shake:1,zoom:1,fx:true};try{Object.assign(cfg,JSON.parse(localStorage.getItem('accr')||'{}'))}catch(e){}
let dg,pausedByMe=false;
const SL=[['s1','sens','o1'],['s2','vol','o2'],['s3','shake','o3'],['s4','zoom','o4']],$=id=>document.getElementById(id);
function applyCfg(){if(dg)dg.gain.value=.04*cfg.vol/.6}
for(const [id,k,o] of SL){const el=$(id);el.value=cfg[k];$(o).textContent=(+cfg[k]).toFixed(2).replace(/0$/,'');el.oninput=()=>{cfg[k]=+el.value;$(o).textContent=(+el.value).toFixed(2).replace(/0$/,'');applyCfg();sv()}}
$('s5').checked=cfg.fx;$('s5').onchange=e=>{cfg.fx=e.target.checked;sv()};
function sv(){try{localStorage.setItem('accr',JSON.stringify(cfg))}catch(e){}}
function setOpen(o){const el=$('set');if(o){el.style.display='flex';pausedByMe=running;running=false}else{el.style.display='none';if(pausedByMe)running=true;pausedByMe=false}}
$('gear').onclick=()=>setOpen($('set').style.display!=='flex');$('rsm').onclick=()=>setOpen(false);
const coarse=matchMedia('(pointer:coarse)').matches;let joy=null,joyId=null;
{const fb=$('fs'),de=document.documentElement;if(!de.requestFullscreen&&!de.webkitRequestFullscreen)fb.style.display='none';
 fb.onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const f=de.requestFullscreen||de.webkitRequestFullscreen,pr=f.call(de,{navigationUI:'hide'});if(pr&&pr.then)pr.then(()=>{try{screen.orientation.lock('landscape')}catch(e){}}).catch(()=>{})}}catch(e){}}}
{const jy=$('joy'),jk=jy.firstElementChild;
 const jm=e=>{const b=jy.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),m=b.width/2,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),k=Math.min(1,d/(m*.8));joy={x:Math.cos(a)*k,y:Math.sin(a)*k};const kd=Math.min(d,m*.65);jk.style.transform='translate('+Math.cos(a)*kd+'px,'+Math.sin(a)*kd+'px)'};
 const je=()=>{joy=null;joyId=null;jk.style.transform='none'};
 jy.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();joyId=e.pointerId;try{jy.setPointerCapture(e.pointerId)}catch(_){}jm(e)});
 jy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)jm(e)});jy.addEventListener('pointerup',je);jy.addEventListener('pointercancel',je)}
let g,running=false,keys={},drag=null,ac,dr,lastB=0,mt;
function reset(){g={t:0,M:1,pool:0,x:0,y:0,vx:0,vy:0,st:0,objs:[],parts:[],cam:6,life:0,peak:1,eaten:0,merged:0,planets:0,flash:0,shake:0,boost:0,escT:0,face:0,ang:0,waveT:-1,jetT:0,pullT:0,cd:{dash:0,pull:0,wave:0,jet:0},hist:[],mps:0,giant:false,dead:false};
 g.cam=.05*Math.min(W,H)/6;for(let i=0;i<90;i++)spawn(true)}
const ext=()=>Math.max(W,H)/2/g.cam,r0=()=>rad(g.M),prad=()=>g.st>=4?3.6*Math.pow(g.M,.4):r0();
function mk(x,y,m,type,col){return{x,y,vx:0,vy:0,m,type,col,par:null,dead:false,ph:R()*TAU}}
function spawn(init,forceBig,forceSmall){
 const e=ext(),d=(init?rr(.2,1.4):rr(1.15,1.6))*e,a=R()*TAU,x=g.x+Math.cos(a)*d,y=g.y+Math.sin(a)*d,M=g.M;
 const lg=Math.max(0,Math.log10(g.M)),big=forceBig||(!forceSmall&&R()<Math.min(.45,.08+g.t/1200+lg*.03)),mid=R()<.38;let o;
 if(big){const m=M*Math.pow(10,rr(.15,.9+Math.min(.6,lg*.08)));
  let t='star';if(g.st<1)t='rock';else if(g.st>=3?R()<Math.min(.7,.45+lg*.04):(g.t>60&&R()<.12))t='bh';
  o=mk(x,y,m,t,t==='rock'?'#8a7a6a':null);
  if(t==='star'){const ro=rad(m);for(let i=0;i<2;i++){const pm=m*rr(.01,.03),pd=ro*rr(3.5,6),pa=R()*TAU,p=mk(x+Math.cos(pa)*pd,y+Math.sin(pa)*pd,pm,'planet','hsl('+rr(0,340)+',55%,55%)');
   const v=Math.sqrt(120*ro**3/pd);p.vx=-Math.sin(pa)*v;p.vy=Math.cos(pa)*v;p.par=o;g.objs.push(p)}}}
 else if(mid){const m=M*Math.pow(10,rr(-.9,-.12));o=R()<.35?mk(x,y,m,'rock','#8a7a6a'):mk(x,y,m,'planet','hsl('+rr(0,340)+',55%,55%)')}
 else o=mk(x,y,M*Math.pow(10,rr(-2.4,-.5)),'gas','hsl('+rr(190,300)+',80%,65%)');
 if(!o.par&&o.type!=='star'||o.type==='star'){const s=rad(M)*rr(0,2.5)*(1+lg*.12),b=R()*TAU;o.vx=Math.cos(b)*s;o.vy=Math.sin(b)*s}
 g.objs.push(o)}
function part(x,y,c){if(!cfg.fx||g.parts.length>220)return;g.parts.push({x,y,vx:rr(-1,1)*r0(),vy:rr(-1,1)*r0(),l:rr(.4,.9),c:c||'#9df'})}
function banner(t,p){msgEl.children[0].textContent=t;msgEl.children[1].textContent=p||'';msgEl.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>msgEl.style.opacity=0,3200)}
function aud(){if(ac)return;try{ac=new AudioContext();dr=ac.createOscillator();const n=ac.createGain();n.gain.value=.04*cfg.vol/.6;dg=n;dr.frequency.value=70;dr.connect(n).connect(ac.destination);dr.start()}catch(e){}}
function blip(f,d=.08,v=.05,ty='sine'){if(!ac)return;const o=ac.createOscillator(),n=ac.createGain(),T=ac.currentTime;o.type=ty;o.frequency.value=f;n.gain.setValueAtTime(v*cfg.vol/.6+1e-4,T);n.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(n).connect(ac.destination);o.start();o.stop(T+d)}
function eat(o,k=.85){const gain=o.m*k*(g.boost>0?1.5:1);if(g.st>=4)g.pool+=gain;else g.M+=gain;o.dead=true;g.eaten++;if(o.type==='planet')g.planets++;
 for(let i=0;i<3;i++)part(o.x,o.y,o.col||'#fff');if(performance.now()-lastB>90){lastB=performance.now();blip(260+R()*300+g.st*40)}}
function lbGet(){try{return JSON.parse(localStorage.getItem('accrLB')||'[]')}catch(e){return[]}}
function lbAdd(){const l=lbGet(),me={t:Math.round(g.t),p:g.peak,s:ST[g.st]};l.push(me);l.sort((a,b)=>b.t-a.t);l.length=Math.min(l.length,10);try{localStorage.setItem('accrLB',JSON.stringify(l))}catch(e){}return [l,me]}
function lbHtml(l,me){const c='style="padding:2px 9px"';return '<table style="margin:4px auto;font-size:12px;border-collapse:collapse"><tr style="color:#8bd"><td '+c+'>#</td><td '+c+'>TIME</td><td '+c+'>PEAK</td><td '+c+'>STAGE</td></tr>'+l.slice(0,5).map((x,i)=>'<tr'+(x===me||(me===undefined&&0)?' style="color:#fff"':'')+'><td '+c+'>'+(i+1)+'</td><td '+c+'>'+mm(x.t)+'</td><td '+c+'>'+fmt(x.p/100)+' M☉</td><td '+c+'>'+x.s+'</td></tr>').join('')+'</table>'}
function die(){if(g.dead)return;g.dead=true;running=false;const lb=lbAdd();g.flash=1;blip(40,1.2,.2,'sawtooth');
 setTimeout(()=>show('<h1 style="font-size:clamp(22px,5vw,44px);letter-spacing:6px">YOUR ACCRETION ENDS HERE</h1><p>Survived <b>'+mm(g.t)+'</b> &nbsp;·&nbsp; Peak mass <b>'+fmt(g.peak/100)+' M☉</b><br>Final stage: '+ST[g.st]+'<br>Objects consumed: '+g.eaten+' (planets: '+g.planets+') &nbsp;·&nbsp; Mergers: '+g.merged+'</p><p style="margin-bottom:0">TOP RUNS ON THIS DEVICE</p>'+lbHtml(lb[0],lb[1])+'<div class="go">RETRY</div>'),900)}
function show(h){scr.innerHTML=h;scr.style.display='flex';scr.style.opacity=0;requestAnimationFrame(()=>scr.style.opacity=1)}
function start(){aud();scr.style.display='none';reset();running=true;banner('GRAVITY HAS BEGUN THE COLLAPSE','Drag / WASD to move. Anything smaller falls into you. Bigger things will eat you.')}
scr.onclick=start;
function use(a){if(!running||g.cd[a]>0)return;const r=r0();
 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(drag){ix+=drag.x;iy+=drag.y}if(joy){ix+=joy.x;iy+=joy.y}
 if(a==='dash'){let f=ix||iy?Math.atan2(iy,ix):g.face;g.vx+=Math.cos(f)*22*r;g.vy+=Math.sin(f)*22*r;g.escT=1.4;g.cd.dash=1.2;blip(120,.2,.08,'triangle')}
 if(a==='pull'){g.pullT=1.5;g.cd.pull=6}
 if(a==='wave'){g.waveT=0;g.cd.wave=7;blip(60,.6,.12,'sine');const rg=30*r;
  for(const o of g.objs){const dx=o.x-g.x,dy=o.y-g.y,d=Math.hypot(dx,dy)||1;if(d<rg){const k=40*r*(1-d/rg)*Math.sqrt(Math.min(1,g.M/o.m));o.vx+=dx/d*k;o.vy+=dy/d*k}}}
 if(a==='jet'){if(g.st<5)return;g.jetT=.6;g.cd.jet=4;g.M*=.97;blip(90,.6,.1,'sawtooth')}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k===' '){use('dash');e.preventDefault()}if(k==='shift')use('pull');if(k==='e')use('wave');if(k==='f')use('jet');if(k==='escape')setOpen($('set').style.display!=='flex');if(!running&&scr.style.display!=='none'&&(k==='enter'))start()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dOrg=null,dId=null;
cv.addEventListener('pointerdown',e=>{if(coarse)return;dId=e.pointerId;dOrg={x:e.clientX,y:e.clientY};drag={x:0,y:0}});
addEventListener('pointermove',e=>{if(e.pointerId!==dId||!dOrg)return;const v=Math.min(1,Math.hypot(e.clientX-dOrg.x,e.clientY-dOrg.y)/(42/cfg.sens)),a=Math.atan2(e.clientY-dOrg.y,e.clientX-dOrg.x);drag={x:Math.cos(a)*v,y:Math.sin(a)*v}});
addEventListener('pointerup',e=>{if(e.pointerId===dId){drag=null;dOrg=null}});
document.querySelectorAll('.b').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();use(b.dataset.a);navigator.vibrate&&navigator.vibrate(15)}));
if(coarse){document.getElementById('btns').style.display='flex';$('joy').style.display='block'}
function stageUpdate(){const M=g.M,o=g.st;
 if(g.st<4){const s=M<100?0:M<1000?1:M<4000?2:3;if(s>g.st){g.st=s;g.flash=s===1?.8:.2;g.shake=s===1?8:3;
  if(s===1)banner('STELLAR IGNITION','Fusion begins when the core is hot and dense enough.');
  if(s===2)banner('MAIN SEQUENCE','A stable star balances gravity against pressure.');
  if(s===3)banner('MASSIVE STAR','~40 M☉ (game threshold): fuel burns fast. Collapse is coming.')}}
 else{const s=M<4e4?4:M<4e5?5:6;if(s>g.st){g.st=s;g.flash=.5;banner(s===5?'QUASAR STATE':'SUPERMASSIVE',s===5?'Jets unlocked (F / JET). A feeding black hole can outshine its galaxy.':'Rival giants now roam the cosmos.')}}
 if(M>=4e6&&!g.giant){g.giant=true;banner('COSMIC GIANT','You may keep growing. How long can you last?')}
 if(g.st!==o&&dr)dr.frequency.value=[70,90,110,60,40,35,30][g.st]}
function collapse(){g.st=4;g.flash=1.5;g.shake=14;g.life=0;banner('BLACK HOLE FORMED','Only crossing an event horizon is irreversible. Swallowed matter queues in the disk (Eddington-style limit).');if(dr)dr.frequency.value=40;blip(35,1.5,.25,'sawtooth');
 const a=R()*TAU,d=ext()*1.5,ap=mk(g.x+Math.cos(a)*d,g.y+Math.sin(a)*d,g.M*1.8,'bh',null);ap.apex=true;g.objs.push(ap)}
function step(dt){
 g.t+=dt;const M=g.M,r=r0(),rp=prad(),Sp=120*r**3*(g.pullT>0?3:1),e=ext();
 for(const k in g.cd)g.cd[k]=Math.max(0,g.cd[k]-dt);g.pullT-=dt;g.boost-=dt;g.escT-=dt;g.jetT-=dt;g.ang+=dt;
 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(drag){ix+=drag.x;iy+=drag.y}if(joy){ix+=joy.x;iy+=joy.y}const n=Math.hypot(ix,iy);if(n>1){ix/=n;iy/=n}if(n>.05)g.face=Math.atan2(iy,ix);
 g.vx+=ix*7*r*cfg.sens*dt;g.vy+=iy*7*r*cfg.sens*dt;
 if(g.st===3){g.life+=dt;if(g.life>=22)collapse()}
 for(let i=0;i<g.objs.length;i++){const o=g.objs[i];if(o.dead)continue;
  const dx=g.x-o.x,dy=g.y-o.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,ro=rad(o.m),So=120*ro**3;
  if(d>e*3.2&&!o.apex){o.dead=true;continue}
  if(d<45*r){const a=Math.min(60*r,Sp/(d2+4*r*r))*Math.min(1,M/o.m);o.vx+=dx/d*a*dt;o.vy+=dy/d*a*dt;
   if(o.m<=M&&d<12*r){const k=.9*dt;o.vx+=(g.vx-o.vx)*k;o.vy+=(g.vy-o.vy)*k}}
  if(d<40*ro&&o.m>M*.05){const a=Math.min(40*r,So/(d2+r*r+ro*ro));const ek=g.escT>0?.08:1;g.vx-=dx/d*a*ek*dt;g.vy-=dy/d*a*ek*dt}
  if(o.par){if(o.par.dead)o.par=null;else{const pdx=o.par.x-o.x,pdy=o.par.y-o.y,pd2=pdx*pdx+pdy*pdy,pd=Math.sqrt(pd2)||1,pr=rad(o.par.m),a=120*pr**3/(pd2+pr*pr);o.vx+=pdx/pd*a*dt;o.vy+=pdy/pd*a*dt}}
  if(o.type==='bh'){const s=ro*(o.apex?6+g.st*.6:2.5+g.st*.3),hunt=o.m>M*1.0,dir=(hunt?1:-1)*(d<e*2.5||o.apex&&hunt?1:0);o.vx+=dx/d*dir*s*dt;o.vy+=dy/d*dir*s*dt;
   const v=Math.hypot(o.vx,o.vy),mv=9*ro;if(v>mv){o.vx*=mv/v;o.vy*=mv/v}
   if(o.apex){o.m*=1+(.006+.0015*g.st)*dt;for(const q of g.objs)if(!q.dead&&q!==o&&q.m<o.m*.8&&Math.hypot(q.x-o.x,q.y-o.y)<ro*.9)q.dead=true}}
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  const hd=o.type==='bh'?ro*.5:ro;
